<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
    <script src="https://cdn.socket.io/4.8.4/socket.io.min.js" integrity="sha384-fBrXvbDtHoeKWJ/hcA6M+YGueiDW+h45I7V6F2kD1S8bOkrF9rZYPLVkCR6BLR/1" crossorigin="anonymous"></script>
    <script>
        let socket = io();
        socket.on("connect", function() {
            socket.emit("ws-welcome", {data: "testing"})
            $("#form").on("submit", function(e) {
                let nickname = $("#nickname").val();
                let content = $("#content").val();
                socket.emit("ws-messages", {
                    "nickname": nickname,
                    "content": content,
                })
                $("#content").val("").focus();
                return false;
            })
        })
        socket.on("ws-messages-responses", function(msg) {
            $("#messages").append("<p><b>" + msg.nickname + ":</b> " + msg.content + "</p>")
        })
    </script>
    <title>Message</title>
  </head>
  <body>
    <h1>Messages</h1>
    <hr>
    <div id="messages">
        {% for item in items %}
        <p><b>{{ item.nickname }}:</b> {{ item.content }}</p>
        {% endfor %}
    </div>
    <hr>
    <form method="POST" id="form">
        <div class="mb-3">
            <label class="form-label">Nickname</label>
            <input type="text" class="form-control" id="nickname">
        </div>
        <div class="mb-3">
            <label class="form-label">Content</label>
            <input type="text" class="form-control" id="content">
        </div>
        <button type="submit" class="btn btn-primary">Send</button>
    </form>
    <hr>
  </body>
</html>
