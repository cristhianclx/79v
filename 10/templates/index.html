<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <title>Rooms</title>
  </head>
  <body>
    <h1>Rooms</h1>
    <hr>
    <a href="{{ url_for('view_rooms_add') }}" class="btn btn-info">Add new room</a>
    <hr>
    <table class="table table-bordered">
  <thead>
    <tr>
      <th scope="col">#</th>
      <th scope="col">Name</th>
      <th scope="col">Messages Max</th>
      <th scope="col">Created</th>
      <th scope="col">Options</th>
    </tr>
  </thead>
  <tbody>
    {% for item in items %}
    <tr>
      <th scope="row">{{ item.id }}</th>
      <td>{{ item.name }}</td>
      <td>{{ item.messages_max }}</td>
      <td>{{ item.created.strftime('%Y-%m-%d|%H:%M:%S') }}</td>
      <td>
        <a href="{{ url_for('view_room_by_id', id=item.id) }}" class="btn btn-info">View room</a>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
  </body>
</html>
